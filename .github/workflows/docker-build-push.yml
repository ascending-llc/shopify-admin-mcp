# Build & push ONE image to ECR (D23). Deploy is a separate workflow (deploy.yml)
# that bumps the single shopify-mcp deployment to the pushed tag and sets the
# SHOPIFY_MCP_MODE flag. Mirrors the Salesforce DX MCP server's ci-asc.yml
# (same AWS account, QEMU+buildx, ensure-repo, latest+sha+release tags).
# Repo: jarvis/shopify_mcp_server.
name: Build & Push Image

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional immutable version tag (e.g., 0.1.1)"
        type: string
        required: false
      region:
        description: "AWS Region"
        type: string
        required: true
        default: us-east-1

permissions:
  id-token: write
  contents: write

env:
  AWS_ACCOUNT_ID: "897729109735"
  ECR_REPOSITORY: jarvis/shopify_mcp_server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gate the image on build + tests (folds in the old standalone ci.yml).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install, build, test
        run: |
          npm ci
          npm run build
          npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.region || 'us-east-1' }}
          role-to-assume: ${{ secrets.SAAS_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ecr-build-session

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}

      - name: Set image tags
        id: set-tags
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ inputs.region || 'us-east-1' }}.amazonaws.com"
          TAGS="$ECR_REGISTRY/$ECR_REPOSITORY:latest
          $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          if [ -n "${{ inputs.release_version }}" ]; then
            TAGS="$TAGS
          $ECR_REGISTRY/$ECR_REPOSITORY:${{ inputs.release_version }}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repo exists
        run: |
          aws ecr describe-repositories \
            --registry-id "$AWS_ACCOUNT_ID" \
            --repository-names "$ECR_REPOSITORY" \
          || aws ecr create-repository \
            --registry-id "$AWS_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true

      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.set-tags.outputs.tags }}
          provenance: false

      - name: Create and push Git tag for release
        if: inputs.release_version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ inputs.release_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping tag creation."
          else
            git tag -a "$TAG" -m "Release version ${{ inputs.release_version }}"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          fi

      - name: Summary
        run: |
          echo "## Shopify MCP Server Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Docker tags pushed:** \`latest\`, \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "  - \`${{ inputs.release_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
