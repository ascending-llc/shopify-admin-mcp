# Deployment Pipeline — "if it's already deployed, update it."
#
# The pod's lifecycle is NOT owned here: the shopify-mcp Deployment+Service are
# created out-of-band by jarvis-deployment (a `mcpConfigs` entry, rendered by the
# jarvis Helm chart). This workflow only:
#   1. rolls the latest ECR image onto an EXISTING shopify-mcp Deployment and sets
#      the SHOPIFY_MCP_MODE flag (read|full) — it no-ops gracefully if the
#      Deployment isn't there yet, instead of erroring.
#   2. optionally (re)registers the server in the Jarvis MCP list.
# Image build/push is a separate manual workflow (docker-build-push.yml).
name: Deploy
on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS Region to deploy to"
        type: string
        required: true
        default: us-east-1
      application:
        description: "Application (namespace) to deploy to"
        type: choice
        required: true
        default: jarvis-demo
        options:
          - jarvis
          - jarvis-demo
      mode:
        description: "Permission mode to deploy (read or full)"
        type: choice
        required: true
        default: read
        options:
          - read
          - full
      register:
        description: "Also (re)register the server in the Jarvis MCP list"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

env:
  EKS_CLUSTER_NAME: ascending-s-api-cluster
  ECR_ACCOUNT_ID: "897729109735"
  DEPLOYMENT_NAME: shopify-mcp

jobs:
  deploy-backend:
    name: Update Deployment on EKS (if present)
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Assume IAM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SAAS_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deployment-role-session
          aws-region: ${{ inputs.region }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "${{ inputs.region }}"

      - name: Update image + mode (only if the Deployment already exists)
        env:
          IMAGE: ${{ env.ECR_ACCOUNT_ID }}.dkr.ecr.${{ inputs.region }}.amazonaws.com/jarvis/shopify_mcp_server:latest
          NS: ${{ inputs.application }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if ! kubectl get "deploy/${DEPLOYMENT_NAME}" -n "$NS" >/dev/null 2>&1; then
            echo "::warning::Deployment ${DEPLOYMENT_NAME} not found in ${NS}."
            echo "Create it first via jarvis-deployment (mcpConfigs + terraform apply). Skipping update."
            exit 0
          fi
          kubectl set image "deploy/${DEPLOYMENT_NAME}" "${DEPLOYMENT_NAME}=${IMAGE}" -n "$NS"
          kubectl set env "deploy/${DEPLOYMENT_NAME}" "SHOPIFY_MCP_MODE=${MODE}" -n "$NS"
          kubectl rollout restart "deploy/${DEPLOYMENT_NAME}" -n "$NS"
          kubectl rollout status "deploy/${DEPLOYMENT_NAME}" -n "$NS" --timeout=180s

  register-with-registry:
    name: Register in Jarvis MCP list
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ inputs.register }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve registry base URL
        id: reg
        run: |
          if [ "${{ inputs.application }}" = "jarvis" ]; then
            echo "base_url=https://jarvis.ascendingdc.com" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://jarvis-demo.ascendingdc.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject Shopify app credentials into config
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Substitute the two secret placeholders (avoids committing app creds).
          jq --arg cid "$SHOPIFY_CLIENT_ID" --arg sec "$SHOPIFY_CLIENT_SECRET" \
            '.config.oauth.client_id = $cid | .config.oauth.client_secret = $sec' \
            registry/shopify-server-config.json > /tmp/shopify-server-config.json

      - name: Register / upsert in MCP list
        env:
          BASE_URL: ${{ steps.reg.outputs.base_url }}
          GATEWAY_TOKEN: ${{ secrets.JARVIS_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # POST /api/servers/register — idempotent upsert by `path` (D20 single shop).
          # The registry forwards the per-user Shopify token (Authorization) and the
          # static config.headers X-Shopify-Shop-Domain to our container per request.
          curl -fsS -X POST "${BASE_URL}/api/servers/register" \
            -H "Authorization: Bearer ${GATEWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/shopify-server-config.json
          echo "Registered Shopify Admin MCP at ${BASE_URL} (path /shopify)."
